<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunnydale Men's Club — Weekly Results</title>
<style>
:root {
  --gd:#1B4332; --gm:#2D6A4F; --gl:#D8F3DC;
  --gold:#C9A84C; --gold-l:#FDF6E3;
  --surf:#F4F6F8; --bdr:#DEE2E6;
  --txt:#1A1A1A; --mut:#6C757D;
  --wh:#FFFFFF; --carry:#FFF3CD; --carry-b:#FFCA2C;
  --rad:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:var(--txt);background:var(--surf);min-height:100vh;}

/* Header */
.hdr{background:var(--gd);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;}
.hdr-logo{font-size:28px;}
.hdr-title h1{font-family:Georgia,serif;font-size:20px;font-weight:normal;letter-spacing:.04em;}
.hdr-title p{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px;}

/* Tabs */
.tabs{background:var(--gd);display:flex;padding:0 24px;gap:2px;border-top:1px solid rgba(255,255,255,.1);}
.tab{padding:10px 20px;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);cursor:pointer;font-size:13px;border-radius:4px 4px 0 0;}
.tab.active{background:var(--surf);color:var(--gd);font-weight:600;}

/* Content */
.content{max-width:960px;margin:0 auto;padding:24px 16px;}
.hidden{display:none!important;}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--mut);}
.loading .spinner{width:36px;height:36px;border:3px solid var(--gl);border-top-color:var(--gm);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* No data */
.no-data{text-align:center;padding:60px 20px;color:var(--mut);}
.no-data .icon{font-size:48px;margin-bottom:12px;}

/* Week selector */
.week-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.week-bar label{font-size:12px;color:var(--mut);font-weight:600;}
.week-bar select{padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rad);font-size:13px;min-width:220px;}
.week-meta{font-size:12px;color:var(--mut);}

/* Payout sheet */
.sheet{background:var(--wh);border:1px solid var(--bdr);border-radius:var(--rad);padding:28px 32px;font-family:Georgia,serif;}
.masthead{text-align:center;border-bottom:3px double var(--gd);padding-bottom:14px;margin-bottom:18px;}
.masthead h1{font-size:22px;color:var(--gd);font-weight:normal;letter-spacing:.06em;}
.masthead .meta{font-family:system-ui,sans-serif;font-size:12px;color:var(--mut);margin-top:4px;}
.masthead .ts{font-family:system-ui,sans-serif;font-size:10px;color:var(--mut);margin-top:2px;}
.psec{margin-bottom:18px;}
.ptitle{font-family:system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--gd);padding:5px 12px;text-transform:uppercase;}
table.pt{width:100%;border-collapse:collapse;font-size:13px;}
table.pt th{font-family:system-ui,sans-serif;font-size:10px;font-weight:600;color:var(--mut);text-align:left;padding:5px 10px;background:var(--surf);border-bottom:1px solid var(--bdr);}
table.pt th.r{text-align:right;}
table.pt td{padding:6px 10px;border-bottom:1px solid var(--surf);vertical-align:top;}
table.pt td.r{text-align:right;}
table.pt tr:last-child td{border-bottom:1px solid var(--bdr);}
.money{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;color:var(--gold);}
.pbadge{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-family:system-ui,sans-serif;font-size:10px;font-weight:700;margin-right:2px;}
.p1b{background:#C9A84C;color:#fff;} .p2b{background:#9E9E9E;color:#fff;} .p3b{background:#8B6914;color:#fff;} .pnb{background:var(--surf);color:var(--mut);}
.fhdr td{background:var(--gl);font-family:system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--gd);padding:4px 10px;border-top:1px solid #95D5B2;}
.cbadge{display:inline-block;padding:1px 6px;background:var(--carry-b);border-radius:3px;font-size:10px;font-weight:700;color:#5C3D00;}
.countback-badge{display:inline-block;padding:1px 6px;background:#E3F2FD;border:1px solid #90CAF9;border-radius:3px;font-size:10px;font-weight:700;color:#0D47A1;}
.flt-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;background:var(--gl);color:var(--gd);font-family:system-ui,sans-serif;}
.pref-bar{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;background:#DCF5FF;color:#0969A2;}
.pref-pro{background:#EDE7FF;color:#6300CC;}
.pref-cash{background:#D4EDDA;color:#155724;}
.pog-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:3px;}
.tbar{display:flex;gap:18px;flex-wrap:wrap;border-top:2px solid var(--gd);padding-top:10px;margin-top:6px;font-family:system-ui,sans-serif;font-size:11px;}
.ti strong{font-size:14px;color:var(--gd);display:block;} .ti span{color:var(--mut);}
.mw-total-row td{font-weight:700;background:var(--gl);font-family:system-ui,sans-serif;}
.cancelled-banner{background:#FFF3CD;border:2px solid var(--carry-b);border-radius:var(--rad);padding:14px;text-align:center;font-weight:700;font-size:16px;color:#856404;margin-bottom:14px;}

/* Leaderboard */
.lb-table{width:100%;border-collapse:collapse;font-size:13px;}
.lb-table th{background:var(--gd);color:#fff;padding:8px 10px;text-align:left;font-size:11px;font-weight:600;}
.lb-table th.r{text-align:right;}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--bdr);}
.lb-table td.r{text-align:right;}
.lb-table tr:nth-child(even) td{background:var(--surf);}
.lbr{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;font-weight:700;font-size:12px;}
.lb1{background:#C9A84C;color:#fff;} .lb2{background:#9E9E9E;color:#fff;} .lb3{background:#8B6914;color:#fff;} .lbn{background:var(--surf);color:var(--mut);}
.lb-search{padding:8px 12px;border:1px solid var(--bdr);border-radius:var(--rad);font-size:14px;width:240px;margin-bottom:14px;}

/* Pot history */
.pot-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.pot-grid{grid-template-columns:1fr;}}
.card{background:var(--wh);border:1px solid var(--bdr);border-radius:var(--rad);overflow:hidden;}
.card h2{font-family:Georgia,serif;font-size:13px;font-weight:normal;background:var(--gm);color:#fff;padding:8px 14px;letter-spacing:.04em;}
.cb{padding:14px;}
table.gt{width:100%;border-collapse:collapse;font-size:13px;}
table.gt th{background:var(--surf);padding:6px 8px;text-align:left;font-size:10px;font-weight:700;color:var(--mut);border-bottom:2px solid var(--bdr);text-transform:uppercase;letter-spacing:.03em;}
table.gt td{padding:7px 8px;border-bottom:1px solid #F0F0F0;}

/* Footer */
.footer{text-align:center;padding:24px;font-size:11px;color:var(--mut);border-top:1px solid var(--bdr);margin-top:32px;}

@media print{
  .tabs,.week-bar,.footer{display:none!important;}
  .sheet{border:none;padding:0;}
}

/* Leaderboard PIN gate */
#lb-pin-input:focus{outline:2px solid var(--gm);border-color:var(--gm);}
#lb-pin-submit:hover{filter:brightness(1.12);}
</style>
</head>

// ── Fetch data ────────────────────────────────────────────────────────────────
async function loadData(){
  try {
    const res = await fetch(RAW_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('Not found');
    appData = await res.json();
    initApp();
  } catch(e) {
    document.getElementById('results-content').innerHTML = `

    document.getElementById('pots-content').innerHTML = '<div class="no-data"><div class="icon">💰</div><p>No pot data yet.</p></div>';
  }
}

function initApp(){
  if(!appData) return;
  populateWeekSelector();
  renderLeaderboard();
  renderPots();
}

// ── Week selector ─────────────────────────────────────────────────────────────
function populateWeekSelector(){
  const weeks = (appData.weeks||[]).slice().reverse();

    document.getElementById('results-content').innerHTML='<div class="no-data"><div class="icon">📋</div><p>No weeks posted yet.</p></div>';

  sel.innerHTML = weeks.map((w,i)=>`<option value="${i}">${w.name||w.id} — ${w.date||''}</option>`).join('');

  renderWeek(weeks[0]);
}

        <td style="color:var(--mut);font-size:11px;">${r.score||'—'}</td>
        <td class="r"><span class="money">${fmt(r.runPot)}</span></td>
        <td class="r">${carry?'<span class="cbadge">CARRY</span>':'<span style="color:#1E8449;font-weight:700;font-family:system-ui;font-size:11px;">PAID</span>'}</td></tr>`;
    });
    html+=`</tbody></table></div>`;

    // POG
    const pogData = w.pog||[];
    html+=`<div class="psec"><div class="ptitle">Pots of Gold — Unique Gross Birdie Required</div>
      <table class="pt"><thead><tr><th>Hole</th><th>Winner</th><th>Flt</th><th>Gross</th><th class="r">Pot</th><th class="r">Status</th></tr></thead><tbody>`;
    pogData.forEach(r=>{
      const carry=!r.paid||!r.winner;
      html+=`<tr style="${carry?'background:var(--carry);':'background:var(--gold-l);'}">
        <td style="font-weight:600;"><span class="pog-dot"></span>${r.hole}</td>
        <td>${r.winner||'<em style="color:var(--mut)">No unique birdie</em>'}</td>
        <td>${r.flt?`<span class="flt-badge">Flt ${r.flt}</span>`:'—'}</td>
        <td style="color:var(--mut);font-size:11px;">${r.score||'—'}</td>
        <td class="r"><span class="money">${fmt(r.runPot)}</span></td>
        <td class="r">${carry?'<span class="cbadge">CARRY</span>':'<span style="color:#1E8449;font-weight:700;font-family:system-ui;font-size:11px;">PAID</span>'}</td></tr>`;
    });
    html+=`</tbody></table></div>`;

    // SKILL
    const skillData = (w.skill||[]).filter(r=>r.winner||r.prize);
    if(skillData.length){
      html+=`<div class="psec"><div class="ptitle">Skill Prizes — Sponsor Awards</div>
        <table class="pt"><thead><tr><th>Hole</th><th>Winner</th><th>Prize</th></tr></thead><tbody>`;
      skillData.forEach(r=>{html+=`<tr><td style="font-weight:600;">${r.hole}</td><td>${r.winner||'—'}</td><td style="color:var(--mut);">${r.prize||'—'}</td></tr>`;});
      html+=`</tbody></table></div>`;
    }

    // DRAWS
    const meatData = w.meat||[];
    const ff = w.ff||null;
    if(meatData.length||ff){
      html+=`<div class="psec"><div class="ptitle" style="background:#5C3D00;">Draw Winners</div>
        <table class="pt"><thead><tr><th>Draw</th><th>Winner</th><th>Prize / Amount</th></tr></thead><tbody>`;
      meatData.forEach((r,i)=>{html+=`<tr><td>🥩 Meat Draw ${i+1}</td><td>${r.winner}</td><td style="color:var(--mut);">${r.prize||'—'}</td></tr>`;});
      if(ff&&ff.winner) html+=`<tr style="background:var(--gold-l);"><td>💵 50/50</td><td>${ff.winner}</td><td><span class="money">${fmt(ff.amount)}</span></td></tr>`;
      html+=`</tbody></table></div>`;
    }

    // MONEY WINNERS
    const mwList = w.moneyWinners||[];
    if(mwList.length){
      html+=`<div class="psec"><div class="ptitle" style="background:#0D47A1;">Weekly Money Winners</div>
        <table class="pt"><thead><tr><th>Rank</th><th>Player</th><th class="r">Gross</th><th class="r">Net</th><th class="r">Skins</th><th class="r">POG</th><th class="r">Draw</th><th class="r">Total</th><th>Payout</th></tr></thead><tbody>`;
      let wkTotal=0;
      mwList.forEach((r,i)=>{
        const rk=i+1; const bc=rk<=3?`p${rk}b`:'pnb'; wkTotal+=r.total||0;
        html+=`<tr><td><span class="pbadge ${bc}">${rk}</span></td><td><strong>${r.name||'—'}</strong></td>
          <td class="r">${r.gross?fmt(r.gross):'—'}</td><td class="r">${r.net?fmt(r.net):'—'}</td>
          <td class="r">${r.skins?fmt(r.skins):'—'}</td><td class="r">${r.pog?fmt(r.pog):'—'}</td>
          <td class="r">${r.draw?fmt(r.draw):'—'}</td>
          <td class="r"><span class="money">${fmt(r.total)}</span></td>
          <td>${prefBadge(r.pref)}</td></tr>`;
      });
      html+=`<tr class="mw-total-row"><td colspan="8" style="text-align:right;padding:5px 10px;">Total paid out:</td><td class="r"><span class="money">${fmt(wkTotal)}</span></td></tr>`;
      html+=`</tbody></table></div>`;
    }
  }

  // TOTALS
  html+=`<div class="tbar">
    <div class="ti"><strong>${fmt(w.totals?.gross)}</strong><span>Gross paid</span></div>
    <div class="ti"><strong>${fmt(w.totals?.net)}</strong><span>Net paid</span></div>
    <div class="ti"><strong>${fmt(w.totals?.skins)}</strong><span>Skins paid</span></div>
    <div class="ti"><strong>${fmt(w.totals?.pog)}</strong><span>POG paid</span></div>
    ${(w.totals?.draw)?`<div class="ti"><strong>${fmt(w.totals.draw)}</strong><span>Draw paid</span></div>`:''}
  </div>`;

  html+=`</div>`; // close .sheet
  document.getElementById('results-content').innerHTML=html;
}

// ── Leaderboard ───────────────────────────────────────────────────────────────
function renderLeaderboard(q=''){
  const rows = Object.entries(appData.season||{})
    .map(([id,v])=>({id,...v}))
    .filter(r=>!q||(r.name||'').toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>(b.total||0)-(a.total||0));
  const fmt=n=>'$'+Number(n||0).toFixed(2);
  if(!rows.length){
    document.getElementById('lb-content').innerHTML='<div class="no-data"><div class="icon">🏆</div><p>No season data yet.</p></div>';
    return;
  }
  let html=`<table class="lb-table"><thead><tr>
    <th>Rank</th><th>Player</th><th class="r">Gross</th><th class="r">Net</th>
    <th class="r">Skins</th><th class="r">POG</th><th class="r">Draw</th>
    <th class="r">Season Total</th><th>Weeks</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const rk=i+1; const rc=rk===1?'lb1':rk===2?'lb2':rk===3?'lb3':'lbn';
    html+=`<tr><td><span class="lbr ${rc}">${rk}</span></td><td><strong>${r.name||'—'}</strong></td>
      <td class="r money">$${(r.gross||0).toFixed(2)}</td><td class="r money">$${(r.net||0).toFixed(2)}</td>
      <td class="r money">$${(r.skins||0).toFixed(2)}</td><td class="r money">$${(r.pog||0).toFixed(2)}</td>
      <td class="r money">$${(r.draw||0).toFixed(2)}</td>
      <td class="r"><strong class="money">$${(r.total||0).toFixed(2)}</strong></td>
      <td style="color:var(--mut);font-size:12px;">${r.weeks||0}</td></tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById('lb-content').innerHTML=html;
}

// ── Pots ──────────────────────────────────────────────────────────────────────
function renderPots(){
  const pots = appData.pots||{};
  const fmt=n=>'$'+Number(n||0).toFixed(2);
  let html=`<div class="pot-grid">
    <div class="card"><h2>Skins — Current Pot by Hole</h2><div class="cb">
      <table class="gt"><thead><tr><th>Hole</th><th class="r">Current Pot</th><th>Last Updated</th></tr></thead><tbody>`;
  SKINS_HOLES.forEach(h=>{
    const d=pots[`sk_${h}`]||{pot:0};
    html+=`<tr><td style="font-weight:600;">${h}</td><td style="text-align:right;font-weight:700;color:var(--gold);">${fmt(d.pot)}</td>
      <td style="color:var(--mut);font-size:11px;">${d.updatedAt?new Date(d.updatedAt).toLocaleDateString():'—'}</td></tr>`;
  });
  html+=`</tbody></table></div></div>
    <div class="card"><h2>Pots of Gold — Current Pot by Hole</h2><div class="cb">
      <table class="gt"><thead><tr><th>Hole</th><th class="r">Current Pot</th><th>Last Updated</th></tr></thead><tbody>`;
  POG_HOLES.forEach(h=>{
    const d=pots[`pg_${h}`]||{pot:0};
    html+=`<tr><td style="font-weight:600;"><span class="pog-dot"></span>${h}</td>
      <td style="text-align:right;font-weight:700;color:var(--gold);">${fmt(d.pot)}</td>
      <td style="color:var(--mut);font-size:11px;">${d.updatedAt?new Date(d.updatedAt).toLocaleDateString():'—'}</td></tr>`;
  });
  html+=`</tbody></table></div></div></div>`;
  document.getElementById('pots-content').innerHTML=html;
}


// ── Leaderboard PIN ──────────────────────────────────────────────────────────
const LB_PIN_KEY   = 'lb_pin_unlocked';       // sessionStorage: '1' when unlocked
const LB_PIN_STORE = 'club_lb_pin';           // localStorage: the PIN itself
const DEFAULT_LB_PIN = '1923';                // default = year club established

function lbPinUnlocked(){ return sessionStorage.getItem(LB_PIN_KEY)==='1'; }

function showLbGate(){
  document.getElementById('lb-pin-gate').style.display   = '';
  document.getElementById('lb-unlocked').style.display   = 'none';
  document.getElementById('lb-pin-input').value          = '';
  document.getElementById('lb-pin-error').style.display  = 'none';
  setTimeout(()=>document.getElementById('lb-pin-input').focus(), 80);
}
function showLbContent(){
  document.getElementById('lb-pin-gate').style.display   = 'none';
  document.getElementById('lb-unlocked').style.display   = '';
  if(appData) renderLeaderboard();
}
function checkLbPin(){
  const entered = document.getElementById('lb-pin-input').value.trim();
  const correct = localStorage.getItem(LB_PIN_STORE) || DEFAULT_LB_PIN;
  if(entered === correct){
    sessionStorage.setItem(LB_PIN_KEY,'1');
    document.getElementById('lb-pin-error').style.display='none';
    showLbContent();
  } else {
    document.getElementById('lb-pin-error').style.display='';
    document.getElementById('lb-pin-input').value='';
    document.getElementById('lb-pin-input').focus();
  }
}

document.getElementById('lb-pin-submit').addEventListener('click', checkLbPin);
document.getElementById('lb-pin-input').addEventListener('keydown', e=>{ if(e.key==='Enter') checkLbPin(); });

// ── Tab switching ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['results','leaderboard','pots'].forEach(t=>{
      document.getElementById(`tab-${t}`).classList.toggle('hidden',`tab-${t}`!==`tab-${btn.dataset.tab}`);
    });
    if(btn.dataset.tab==='leaderboard'){
      if(lbPinUnlocked()) showLbContent(); else showLbGate();
    }
  });
});

// Leaderboard search
document.getElementById('lb-search').addEventListener('input',e=>{
  if(appData) renderLeaderboard(e.target.value);
});

// Fix tab data attr
document.querySelectorAll('.tab').forEach((btn,i)=>{
  btn.dataset.tab=['results','leaderboard','pots'][i];
});

// Load data
loadData();
</script>
